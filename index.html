<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">

<title>نُورِ ہُدٰی - 57 فیچرز - Voice + Location</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Nastaliq Urdu',serif}
body{background:#062a20;color:#fff;padding:10px}
.hdr{background:rgba(0,0,0,.6);border:3px solid gold;border-radius:16px;padding:15px;text-align:center}
.card{background:#fff;color:#111;border-radius:16px;padding:14px;margin:12px 0;border:3px solid #0a5c36}

.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer;font-size:15px}
.bg{background:#0a7a42;color:#fff}
.bd{background:gold;color:#000}
select,textarea,input{width:100%;padding:10px;border:2px solid #0a7a42;border-radius:10px;margin-top:8px;font-size:15px}
.chat{max-height:350px;overflow-y:auto;background:#f0fdf4;border:2px solid #0a7a42;border-radius:12px;padding:8px;margin-top:10px}
.msg{margin:8px 0;padding:10px;border-radius:10px;line-height:1.6}
.user{background:#0a7a42;color:#fff;margin-left:20px}
.bot{background:#ffeb80;border:1px solid gold;color:#111;margin-right:10px}
.loc-box{background:#e8f5e9;border:2px dashed #0a7a42;border-radius:10px;padding:10px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="hdr">
<h1>نُورِ ہُدٰی - 57 فیچرز</h1>
<p style="color:gold">AI دی دنیا اچ ہر زبان اچ اسلامی سوال + لوکیشن Voice</p>
<p style="font-size:12px">Saraiki | Urdu | English | العربية | Hindi | Turkish - 100 Languages</p>
</div>

<div class="card">

<select id="lng">

<option value="ur">اردو - Urdu</option>
<option value="en">English</option>
<option value="ar">العربية</option>
<option value="hi">Hindi</option>
<option value="tr">Turkish</option>
<option value="auto">Auto Detect</option>
</select>
<textarea id="q" rows="3" placeholder="مثال: نماز دی نیت کیویں؟ What is wudu? غسل کیسے؟"></textarea>
<button class="btn bg" onclick="ask()">🤲 جواب گھنو - Ask AI</button>
<button class="btn bd" onclick="voice()">🎤 بولو - Voice Input</button>
<button class="btn" style="background:#ff9800;color:#000" onclick="speakLast()">🔊 جواب آواز اچ سُنو</button>
<button class="btn" style="background:red;color:#fff" onclick="speechSynthesis.cancel()">🔇 آواز بند</button>
<div id="chat" class="chat" style="display:none"></div>
</div>
