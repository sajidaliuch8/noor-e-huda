<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نُورِ ہُدٰی - دنیا کی ہر جگہ کی لوکیشن Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Nastaliq Urdu',serif}
body{background:#062a20;color:#fff;padding:10px}
.hdr{background:rgba(0,0,0,.6);border:3px solid gold;border-radius:16px;padding:15px;text-align:center}
.card{background:#fff;color:#111;border-radius:16px;padding:14px;margin:12px 0;border:3px solid #0a5c36}
.card h2{color:#0a5c36;border-bottom:2px solid gold;padding-bottom:5px;margin-bottom:8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer;font-size:15px}
.bg{background:#0a7a42;color:#fff}
.bd{background:gold;color:#000}
input,select{width:100%;padding:12px;border:2px solid #0a7a42;border-radius:10px;margin-top:8px;font-size:16px}
#map{height:300px;border-radius:12px;border:3px solid gold;margin-top:10px}
.box{background:#e8f5e9;border:2px dashed #0a7a42;border-radius:10px;padding:12px;margin-top:8px;text-align:center;line-height:1.8}
.dest{font-size:18px;color:#0a5c36;font-weight:bold}
</style>
</head>
<body>
<div class="hdr">
<h1>نُورِ ہُدٰی - عالمی لوکیشن گائیڈ 🕋🌍</h1>
<p style="color:gold">کوئی بھی جگہ لکھو - فاصلہ ہر KM تے آواز اچ دسیسی</p>
</div>

<div class="card" style="border-color:gold;border-width:4px">
<h2>📍🕋 منزل لکھو - دنیا کے کسی کونے دی</h2>
<input id="destInput" placeholder="مثال: Madina Haram, Makkah Haram, لاہور بادشاہی مسجد, دبئی برج خلیفہ"/>
<div style="display:flex;gap:6px">
<button class="btn bg" onclick="searchDest()" style="width:50%">🔍 جگہ لبھو</button>
<button class="btn bd" onclick="useCurrent()" style="width:50%">📍 میری لوکیشن</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px">
<button class="btn" style="background:#000;color:gold;border:1px solid gold" onclick="setDest('Madinah Haram Sharif, Saudi Arabia','مدینہ منورہ حرم شریف')">🕌 مدینہ</button>
<button class="btn" style="background:#000;color:gold;border:1px solid gold" onclick="setDest('Makkah Haram Sharif, Saudi Arabia','مکہ مکرمہ حرم شریف')">🕋 مکہ</button>
<button class="btn" style="background:#000;color:gold;border:1px solid gold" onclick="setDest('Masjid Al Aqsa, Jerusalem','مسجد اقصیٰ')">🕌 اقصیٰ</button>
</div>
<div id="info" class="box">کوئی منزل لکھو سئیں... پھر فاصلہ ہر کلومیٹر تے بول کر دسیساں!</div>
<div id="map"></div>
<button class="btn bg" onclick="startNav()">🚀 نیویگیشن شروع - ہر KM آواز</button>
<button class="btn" style="background:red;color:white" onclick="stopNav()">🔇 نیویگیشن بند</button>
</div>

<div class="card">
<h2>🤖 اسلامی سوال - AI + Voice</h2>
<input id="q" placeholder="سوال لکھو..."/>
<button class="btn bg" onclick="ask()">جواب گھنو + آواز</button>
<div id="ans" class="box" style="display:none"></div>
</div>

<script>
let map=L.map('map').setView([21.3891,39.8579],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let userMarker=null, destMarker=null, destLat=null, destLon=null, destName="منزل";
let watchId=null, totalTraveled=0, lastLat=null, lastLon=null, initialDistance=0;

function speak(t, lang='ur-PK'){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(t);
u.lang=lang; u.rate=0.85; u.volume=1;
speechSynthesis.speak(u);
}

async function searchDest(){
let q=document.getElementById('destInput').value.trim();
if(!q){alert('جگہ لکھو سئیں!');return;}
setDest(q,q);
}

async function setDest(query, displayName){
destName=displayName||query;
document.getElementById('info').innerHTML=`⏳ ${destName} لبھدا پیاں...`;
speak(` ${destName} لبھدا پیاں سئیں`);
try{
let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
let data=await res.json();
if(data.length==0){document.getElementById('info').innerHTML=`❌ ${destName} نہیں ملی، دوبارہ لکھو`; return;}
destLat=parseFloat(data[0].lat); destLon=parseFloat(data[0].lon);
if(destMarker) map.removeLayer(destMarker);
destMarker=L.marker([destLat,destLon]).addTo(map).bindPopup(destName).openPopup();
map.setView([destLat,destLon],13);
document.getElementById('info').innerHTML=`✅ منزل: <span class="dest">${destName}</span><br>📍 ${destLat.toFixed(5)}, ${destLon.toFixed(5)}<br>🔊 ہݨ نیویگیشن شروع کرو!`;
speak(`${destName} مل گئی سئیں، ہݨ نیویگیشن شروع کرو`, 'ur-PK');
}catch(e){document.getElementById('info').innerHTML="❌ انٹرنیٹ چیک کرو";}
}

function getDist(lat1,lon1,lat2,lon2){
let R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
let a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function useCurrent(){
if(!navigator.geolocation){alert('GPS نہیں');return;}
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude, lon=p.coords.longitude;
if(userMarker) map.removeLayer(userMarker);
userMarker=L.marker([lat,lon],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/64/64113.png',iconSize:[30,30]})}).addTo(map);
map.setView([lat,lon],13);
if(destLat){calcAndShow(lat,lon);}
});
}

function calcAndShow(uLat,uLon){
if(!destLat) return;
let dist=getDist(uLat,uLon,destLat,destLon);
return dist;
}

function startNav(){
if(!destLat){alert('پہلے منزل لکھو! مدینہ، مکہ وغیرہ');return;}
if(!navigator.geolocation){alert('Location Allow کرو');return;}
speak(`نیویگیشن شروع سئیں، ${destName} تئیں سفر شروع، ہر کلومیٹر تے بقایا فاصلہ دسیساں`, 'ur-PK');
document.getElementById('info').innerHTML=`🚀 ${destName} ول سفر شروع...`;

navigator.geolocation.getCurrentPosition(pos=>{
lastLat=pos.coords.latitude; lastLon=pos.coords.longitude;
initialDistance=getDist(lastLat,lastLon,destLat,destLon);
totalTraveled=0;
if(watchId) navigator.geolocation.clearWatch(watchId);
watchId=navigator.geolocation.watchPosition(pos2=>{
let nLat=pos2.coords.latitude, nLon=pos2.coords.longitude;
let moved=getDist(lastLat,lastLon,nLat,nLon);
if(moved>=0.05){ // ہر 50 میٹر تے چیک، 1 KM تے بولے
totalTraveled+=moved;
lastLat=nLat; lastLon=nLon;
let remaining=getDist(nLat,nLon,destLat,destLon);
if(userMarker) map.removeLayer(userMarker);
userMarker=L.marker([nLat,nLon]).addTo(map);

let isOneKm = Math.floor(totalTraveled) > Math.floor(totalTraveled - moved) || remaining <= 1.1;

if(isOneKm || remaining < 1){
let msg="";
if(remaining <= 0.1){
msg=`ماشاءاللہ سئیں! تُساں ${destName} پہنچ گئے او! الحمدللہ! اللہ تہاڈی حاضری قبول فرماوے!`;
document.getElementById('info').innerHTML=`🎉 پہنچ گئے! ${destName}<br>✅ کل سفر ${totalTraveled.toFixed(2)} KM`;
speak(msg,'ur-PK');
stopNav();
}else{
let remainText=remaining.toFixed(1);
if(remaining <= 1){
msg=`سئیں! ${destName} بقایا صرف ${remainText} کلومیٹر دور اے! بس تھوڑا جیا فاصلہ باقی اے!`;
}else{
msg=`سئیں! ${destName} بقایا ${remainText} کلومیٹر دور اے! ہُن تک ${totalTraveled.toFixed(1)} کلومیٹر سفر تھی گئے!`;
}
document.getElementById('info').innerHTML=`📍 تہاڈی لوکیشن: ${nLat.toFixed(4)}, ${nLon.toFixed(4)}<br>🕋 منزل: ${destName}<br>📏 بقایا فاصلہ: <b style="font-size:22px;color:red">${remainText} KM</b><br>🚶 طے شدہ: ${totalTraveled.toFixed(2)} KM / کل ${initialDistance.toFixed(2)} KM`;
speak(msg,'ur-PK');
}
}
}
},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
});
}

function stopNav(){
if(watchId){navigator.geolocation.clearWatch(watchId); watchId=null;}
speak('نیویگیشن بند کر ڈتی','ur-PK');
}

async function ask(){
let q=document.getElementById('q').value.trim();
if(!q) return;
let box=document.getElementById('ans'); box.style.display='block'; box.innerHTML='⏳ جواب تیار...';
try{
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Islamic scholar answer in Saraiki/Urdu: '+q));
let t=await res.text();
box.innerHTML=`🤲 ${t}`;
speak(t,'ur-PK');
}catch(e){box.innerHTML='سئیں اسلام مکمل دین اے';}
}
</script>
</body>
</html>
